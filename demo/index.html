<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energydash demo</title>
  <meta name="description" content="Try the Energydash panel for Home Assistant with a simulated household: electricity cost per device, per session, per day, and in baseload.">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #03a9f4;
      --primary-background-color: #fafafa;
      --secondary-background-color: #e5e5e5;
      --card-background-color: #ffffff;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --text-primary-color: #ffffff;
      --divider-color: rgba(0, 0, 0, 0.12);
      --success-color: #43a047;
      --warning-color: #ffa600;
      --error-color: #db4437;
      --app-header-background-color: #03a9f4;
      --app-header-text-color: #ffffff;
      --paper-font-body1_-_font-family: Roboto, Noto, sans-serif;
      --demo-bar: #1c1c1c;
      color-scheme: light;
    }
    html.dark {
      --primary-background-color: #111111;
      --secondary-background-color: #282828;
      --card-background-color: #1c1c1c;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --divider-color: rgba(225, 225, 225, 0.12);
      --app-header-background-color: #101e24;
      --app-header-text-color: #e1e1e1;
      --demo-bar: #000000;
      color-scheme: dark;
    }
    html, body { margin: 0; background: var(--primary-background-color); font-family: Roboto, Noto, sans-serif; }
    .demo-bar {
      display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--demo-bar); color: #f1f1f1; font-size: 14px; line-height: 1.4;
    }
    .demo-bar p { margin: 0; flex: 1 1 320px; }
    .demo-bar a { color: #8fd3ff; }
    .demo-bar .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .demo-bar select, .demo-bar button {
      font: inherit; font-size: 13px; color: #f1f1f1; background: #2e2e2e; border: 1px solid #555; border-radius: 6px; padding: 5px 10px; cursor: pointer;
    }
    .demo-bar label { display: inline-flex; gap: 6px; align-items: center; }
    .loading { padding: 48px 16px; text-align: center; color: var(--secondary-text-color); }
  </style>
</head>
<body>
  <div class="demo-bar" role="region" aria-label="Demo">
    <p><b>Energydash demo.</b> A simulated household with dynamic prices and solar panels, calculated by the real integration.
      Changes stay in this tab. <a href="https://github.com/Radeaus/Energydash">Install it in Home Assistant</a></p>
    <div class="controls">
      <label>Language <select id="lang"></select></label>
      <button id="theme" type="button">Light or dark</button>
      <button id="restart" type="button">Start over</button>
    </div>
  </div>
  <div id="panel"><div class="loading">Loading the demo…</div></div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
