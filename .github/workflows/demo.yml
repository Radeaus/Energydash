name: Demo

# Builds the demo (the real panel with a simulated household) and publishes it on GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the panel
        run: npm ci && npm run build
        working-directory: frontend
      - name: Generate demo data with the calculation core
        run: python demo/generate.py _site/data.json
      - name: Assemble the site
        run: |
          cp demo/index.html demo/demo.js demo/icons.js _site/
          cp custom_components/energydash/frontend/energydash-panel.js _site/
          cp custom_components/energydash/brand/icon.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
